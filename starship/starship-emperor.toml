
# ╔══════════════════════════════════════════╗
# ║          RETRO PHOSPHOR TERMINAL         ║
# ╚══════════════════════════════════════════╝

add_newline = true
command_timeout = 1000

format = """
[┌─](bold #FF3048)$username$directory$git_branch$git_status
[└─](bold #FF3048)$character"""

# ── User ────────────────────────────────────
[username]
show_always = true
style_user = "bold #FF3048"
style_root = "bold #DC143C"
format = "[$user](bold #FF3048) "

# ── Directory ───────────────────────────────
[directory]
style = "bold #FF3048"
format = "[\\[$path\\]]($style) "
truncation_length = 3
truncate_to_repo = true
read_only = " [RO]"
read_only_style = "bold #DC143C"

# ── Git ────────────────────────────────────
[git_branch]
symbol = "git:"
style = "bold #DC143C"
format = "[ $symbol$branch]($style) "

[git_status]
style = "bold #DC143C"
format = "[$all_status$ahead_behind]($style) "

# ── Command prompt ─────────────────────────
[character]
success_symbol = "[>](bold #FF3048)"
error_symbol = "[>](bold #FF667A)"
vimcmd_symbol = "[<](bold #DC143C)"

# ── Command duration ───────────────────────
[cmd_duration]
min_time = 2000
format = "[TIME: $duration](bold #DC143C) "

# ── Exit status ────────────────────────────
[status]
disabled = false
format = "[EXIT $status](bold #FF667A) "
pipestatus = true

